<html lang="it">
<head>
<meta charset="utf-8">

<style>
  :root {
    color-scheme: dark;
    --ink: #140f0c;          /* nero inchiostro caldo */
    --ink-2: #1f1813;
    --ink-3: #2b221b;
    --line: #463629;
    --paper: #eadbc0;        /* pergamena delle carte */
    --paper-dim: #b8a88d;
    --muted: #8c7c68;
    --temple: #e8631c;       /* arancio del retro carta */
    --temple-dim: #a8481a;
    --gold: #d4ae62;
    --blood: #d8412f;
    --jade: #55b98a;
    --violet: #a978e0;
    --sky: #6fb3e6;
    --display: 'Rubik Dirt', 'Impact', 'Arial Black', sans-serif;
    --label: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--paper);
    font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  #app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-inline: 16px; display: flex; flex-direction: column; }

  /* ---------- elementi comuni ---------- */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 10px 18px; border-radius: 6px; border: 1.5px solid var(--line);
    background: var(--ink-2); font-family: var(--label); font-weight: 700; font-size: 18px;
    letter-spacing: .04em; text-transform: uppercase; cursor: pointer; text-align: center;
  }
  .btn:focus-visible, .tile:focus-visible, .pick:focus-visible, .move:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn.primary { background: var(--temple); border-color: var(--temple); color: #1a0d05; }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 38px; font-size: 15px; padding: 6px 12px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .eyebrow { font-family: var(--label); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--paper-dim); }
  h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
  h2 { font-size: 30px; color: var(--paper); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
  .back { min-height: 40px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent; font-family: var(--label); font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  .chip { display: inline-flex; align-items: center; gap: 3px; font-family: var(--label); font-weight: 600; font-size: 12px; line-height: 1; padding: 3px 5px; border-radius: 3px; background: var(--ink-3); color: var(--paper); white-space: nowrap; }
  .chip.bad { background: #4a1d17; color: #ffb4a8; }
  .chip.good { background: #173a2b; color: #a6e8c6; }
  .chip.info { background: #2a2140; color: #d4bdf5; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- home ---------- */
  .home { flex: 1; display: flex; flex-direction: column; gap: 22px; padding-block: 28px 24px; }
  .hero { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: center; }
  .hero img { width: 112px; aspect-ratio: 1060/1484; border-radius: 8px; object-fit: cover; box-shadow: 0 10px 30px #0009; transform: rotate(-4deg); }
  .hero h1 { font-size: clamp(38px, 11vw, 54px); color: var(--temple); }
  .hero p { margin: 8px 0 0; color: var(--paper-dim); font-size: 15px; }
  .fan { display: flex; justify-content: center; height: 150px; margin-top: 6px; }
  .fan img { width: 96px; aspect-ratio: 4/5; object-fit: cover; object-position: 50% 20%; border-radius: 6px; border: 2px solid var(--ink); margin-inline: -18px; box-shadow: 0 8px 20px #000a; }
  .menu { display: grid; gap: 10px; }
  .menu .btn { min-height: 56px; font-size: 20px; }
  .footnote { color: var(--muted); font-size: 13px; text-align: center; margin-top: auto; }

  /* ---------- setup / scelta squadra ---------- */
  .setup { display: flex; flex-direction: column; gap: 14px; padding-bottom: 24px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg button { min-height: 44px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--ink-2); font-family: var(--label); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; }
  .seg button[aria-pressed="true"] { border-color: var(--temple); color: var(--temple); }
  .field-label { display: grid; gap: 6px; }
  .field-label input { min-height: 46px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--ink-2); color: var(--paper); padding: 8px 12px; font: 16px var(--body); }

  .builder { display: flex; flex-direction: column; gap: 12px; padding-bottom: 110px; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .slot { position: relative; aspect-ratio: 4/5; border: 1.5px dashed var(--line); border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; background: var(--ink-2); cursor: pointer; padding: 0; }
  .slot .who { position: absolute; top: 4px; left: 5px; font-family: var(--label); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--paper-dim); z-index: 1; text-shadow: 0 1px 2px #000; }
  .slot.res { border-color: var(--gold); }
  .slot .face { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .slot .nm { position: relative; width: 100%; background: linear-gradient(transparent, #000d 40%); font-family: var(--label); font-weight: 700; font-size: 13px; padding: 14px 4px 4px; text-align: center; line-height: 1.05; }
  .budget { display: flex; align-items: center; gap: 10px; font-family: var(--label); font-weight: 600; font-size: 16px; }
  .pips { display: flex; gap: 3px; flex: 1; }
  .pips i { flex: 1; height: 8px; border-radius: 2px; background: var(--ink-3); }
  .pips i.on { background: var(--temple); }
  .pips i.over { background: var(--blood); }
  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .filters button { flex: none; min-height: 34px; padding: 4px 12px; border-radius: 17px; border: 1px solid var(--line); background: transparent; font-family: var(--label); font-weight: 600; font-size: 14px; letter-spacing: .04em; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .pool { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pick { position: relative; border: 1.5px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--ink-2); padding: 0; cursor: pointer; text-align: left; display: flex; flex-direction: column; }
  .pick .face { aspect-ratio: 1/1; background-size: cover; background-position: center; }
  .pick .meta { padding: 5px 6px 6px; display: grid; gap: 2px; }
  .pick .nm { font-family: var(--label); font-weight: 700; font-size: 14px; line-height: 1.05; }
  .pick .st { font-family: var(--label); font-size: 12.5px; color: var(--paper-dim); }
  .cost { position: absolute; top: 5px; right: 5px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--ink); border: 1.5px solid var(--gold); color: var(--gold); display: grid; place-items: center; font-family: var(--label); font-weight: 700; font-size: 14px; }
  .rank { position: absolute; top: 5px; left: 5px; font-family: var(--label); font-weight: 700; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 5px; border-radius: 3px; background: #000b; color: var(--paper); }
  .rank.M { color: var(--gold); } .rank.I { color: var(--sky); }
  .rank.L { color: #1a0d05; background: linear-gradient(90deg, #d4ae62, #f5e27a); }
  .pick.chosen { border-color: var(--temple); }
  .pick.chosen::after { content: '✓'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 42px; color: var(--temple); background: #140f0caa; font-weight: 700; }
  .pick.nope { opacity: .38; }
  .info-dot { position: absolute; bottom: 6px; right: 6px; width: 26px; height: 26px; border-radius: 13px; border: 1px solid var(--line); background: var(--ink); font-family: var(--label); font-weight: 700; font-size: 14px; display: grid; place-items: center; cursor: pointer; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--ink) 30%); }
  .dock .row { max-width: 528px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }

  /* ---------- battaglia ---------- */
  .battle { flex: 1; display: flex; flex-direction: column; gap: 8px; padding-block: 8px 12px; min-height: 100%; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .side-name { font-family: var(--label); font-weight: 700; font-size: 16px; letter-spacing: .05em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .side-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-name .turn-dot { width: 9px; height: 9px; border-radius: 5px; background: var(--ink-3); flex: none; }
  .side-name.active .turn-dot { background: var(--temple); box-shadow: 0 0 0 4px #e8631c33; }
  .res-info { font-family: var(--label); font-size: 13px; color: var(--paper-dim); text-align: right; line-height: 1.2; min-width: 0; }
  .side-name { flex: none; max-width: 58%; }
  .syn-tag { display: block; font-size: 12px; }
  .row-fighters { display: grid; gap: 7px; }
  .tile { position: relative; border-radius: 7px; border: 1.5px solid var(--line); background: var(--ink-2); overflow: hidden; padding: 0; cursor: pointer; text-align: left; display: flex; flex-direction: column; transition: transform .15s, border-color .15s, opacity .2s; }
  .tile .face { aspect-ratio: 1/1; background-size: cover; background-position: center; position: relative; }
  .tile .body { padding: 5px 6px 6px; display: grid; gap: 4px; }
  .tile .nm { font-family: var(--label); font-weight: 700; font-size: 14px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hp { height: 7px; border-radius: 4px; background: #000; overflow: hidden; }
  .hp i { display: block; height: 100%; background: var(--jade); transition: width .5s; }
  .hp i.mid { background: var(--gold); } .hp i.low { background: var(--blood); }
  .stats { display: flex; justify-content: space-between; font-family: var(--label); font-weight: 600; font-size: 12.5px; color: var(--paper-dim); }
  .stats > span { white-space: nowrap; }
  .stats b { margin-left: 1px; }
  .four .stats { font-size: 11px; }
  .four .tile .nm { font-size: 12.5px; }
  .four .tile .body { padding: 4px 4px 5px; }
  .stats b { color: var(--paper); font-weight: 700; }
  .stats b.up { color: #8fe0b5; } .stats b.down { color: #ff9c8c; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; min-height: 18px; }
  .tile.acted { opacity: .55; }
  .tile.acted .face::after { content: 'HA AGITO'; position: absolute; inset: auto 0 0; background: #000c; font-family: var(--label); font-weight: 700; font-size: 11px; letter-spacing: .1em; text-align: center; padding: 2px; }
  .tile.stunned .face { filter: grayscale(.9); }
  .tile.selected { border-color: var(--temple); transform: translateY(-3px); box-shadow: 0 0 0 2px var(--temple); }
  .tile.target { border-color: var(--gold); animation: pulse 1s infinite; }
  .tile.dim { opacity: .35; }
  .tile.acting { border-color: var(--temple); box-shadow: 0 0 0 3px var(--temple); }
  .tile.hit { animation: shake .35s; }
  .tile.ko { opacity: 0; transform: scale(.85); transition: opacity calc(.5s * var(--pace, 1)), transform calc(.5s * var(--pace, 1)); }
  .float { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); font-family: var(--display); font-size: 30px; pointer-events: none; text-shadow: 0 2px 0 #000, 0 0 8px #000; animation: rise calc(1s * var(--pace, 1)) forwards; z-index: 3; white-space: nowrap; }
  .float.dmg { color: #ff6a50; } .float.heal { color: #8fe0b5; } .float.st { font-family: var(--label); font-weight: 700; font-size: 15px; color: var(--gold); letter-spacing: .06em; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 10px); } 15% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -34px); } }
  @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-5px) rotate(-1deg); } 75% { transform: translateX(5px) rotate(1deg); } }
  @keyframes pulse { 50% { box-shadow: 0 0 0 3px #d4ae6288; } }

  .turn-lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* velocità di gioco: sempre a portata, discreta */
  .speed { display: flex; flex: none; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: var(--ink); }
  .speed button { min-width: 40px; min-height: 40px; padding: 0 8px; border: 0; background: transparent; font-size: 17px; line-height: 1; cursor: pointer; opacity: .7; }
  .speed button[aria-pressed="true"] { opacity: 1; background: var(--ink-3); box-shadow: inset 0 -2px 0 var(--temple); }
  .speed button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .mid { display: grid; gap: 6px; align-content: center; padding-block: 4px; }
  .banner { font-family: var(--label); font-weight: 700; font-size: 17px; letter-spacing: .04em; text-align: center; min-height: 24px; color: var(--gold); }
  .log { border: 1px solid var(--line); border-radius: 6px; background: #0d0a08; padding: 6px 10px; font-size: 13.5px; line-height: 1.35; max-height: 78px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; }
  .log p { margin: 0; color: var(--paper-dim); }
  .log p:last-child { color: var(--paper); }
  .log.open { max-height: 44vh; overflow-y: auto; justify-content: flex-start; }
  .actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions-row.three { grid-template-columns: 1fr 1fr 1.15fr; }
  .actions-row.three .btn { padding-inline: 8px; font-size: 16px; }
  .share-link { width: min(100%, 420px); height: 110px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--ink-2); color: var(--paper); font: 12px var(--body); padding: 8px; word-break: break-all; }
  .overlay .menu-2 { width: min(100%, 340px); }
  .overlay .menu-2 .btn { min-width: 0; }
  /* torneo dal vivo */
  .live-names { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .live-names input { min-height: 44px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--ink-2); color: var(--paper); padding: 6px 10px; font: 16px var(--body); min-width: 0; }
  .lm-list { display: grid; gap: 8px; }
  .lm { border: 1.5px solid var(--line); border-radius: 8px; background: var(--ink-2); padding: 8px 10px; display: grid; gap: 2px; }
  .lm-row { font-family: var(--label); font-weight: 700; font-size: 17px; color: var(--paper); }
  .lm-row i { font-weight: 500; color: var(--muted); }
  .lm-row.win { color: var(--gold); }
  .lm-row.lose { color: var(--muted); text-decoration: line-through; }
  .lm-vs { font-family: var(--label); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .lm-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 6px; }
  .lm-btns .btn { min-height: 40px; font-size: 13.5px; padding: 4px 6px; }
  .lm-fix { align-self: center; font-family: var(--label); font-size: 13px; color: var(--muted); text-align: center; }
  .champion { text-align: center; border: 2px solid var(--gold); border-radius: 12px; padding: 14px; background: radial-gradient(circle at 50% 0%, #4a3510, #1f1810); animation: drop .5s ease-out; }
  .champion .trophy { font-size: 64px; line-height: 1; animation: vs-slam .7s cubic-bezier(.2, 1.6, .4, 1) both; }
  .champion b { display: block; font-family: var(--display); font-weight: 400; font-size: 36px; color: var(--gold); margin-top: 4px; }
  /* carte effetto */
  .hand { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .fx-card { display: flex; align-items: center; gap: 6px; text-align: left; padding: 6px 8px; border-radius: 7px; border: 1.5px solid var(--gold); background: linear-gradient(135deg, #2a1f10, #1a140d); cursor: pointer; min-height: 52px; }
  .fx-card.on { border-color: var(--temple); box-shadow: 0 0 0 2px var(--temple); }
  .fx-card:disabled { cursor: default; opacity: .55; }
  .fx-card.used { opacity: .3; filter: grayscale(1); }
  .fx-e { font-size: 22px; flex: none; }
  .fx-t { display: grid; gap: 1px; min-width: 0; }
  .fx-t b { font-family: var(--label); font-size: 14.5px; line-height: 1.05; color: var(--gold); }
  .fx-t small { font-size: 11.5px; line-height: 1.2; color: var(--paper-dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* consiglio */
  .tile.hinted { border-color: var(--jade); box-shadow: 0 0 0 3px var(--jade); }
  .hint-box { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1.5px solid var(--jade); border-radius: 8px; padding: 6px 8px 6px 10px; background: #12261d; font-family: var(--label); font-weight: 600; font-size: 15px; color: #c9f2dc; }
  .hint-box .btn { flex: none; min-height: 38px; }
  /* testo grande: tutto più grande e il testo va a capo da sé */
  html.big #app, html.big #layer { zoom: 1.16; }
  /* schermata VS */
  .vs-screen { gap: 14px; }
  .vs-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; width: min(100%, 460px); }
  .vs-team { display: grid; gap: 5px; justify-items: center; }
  .vs-team b { font-family: var(--label); font-size: 17px; letter-spacing: .04em; text-transform: uppercase; color: var(--paper); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vs-team.left { animation: vs-left .5s cubic-bezier(.2, 1.3, .4, 1) both; }
  .vs-team.right { animation: vs-right .5s cubic-bezier(.2, 1.3, .4, 1) both; }
  .vs-who { display: flex; align-items: center; gap: 6px; width: 100%; }
  .vs-team.right .vs-who { flex-direction: row-reverse; }
  .vs-who i { width: 44px; height: 44px; border-radius: 6px; background-size: cover; background-position: center; border: 1.5px solid var(--line); flex: none; }
  .vs-who span { font-family: var(--label); font-weight: 600; font-size: 14px; color: var(--paper-dim); white-space: nowrap; }
  .vs-mid { font-family: var(--display); font-size: 58px; color: var(--temple); text-shadow: 0 4px 0 #000, 0 0 30px #e8631c88; animation: vs-slam .6s .35s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes vs-left { from { opacity: 0; transform: translateX(-60%); } }
  @keyframes vs-right { from { opacity: 0; transform: translateX(60%); } }
  @keyframes vs-slam { from { opacity: 0; transform: scale(3) rotate(-12deg); } }

  .sheet-wrap { position: fixed; inset: 0; background: #000a; display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet { width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto; background: var(--ink-2); border-top: 2px solid var(--temple); border-radius: 12px 12px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
  .sheet-head { display: flex; gap: 12px; align-items: center; }
  .sheet-head .face { width: 58px; height: 58px; border-radius: 6px; background-size: cover; background-position: center; flex: none; }
  .sheet-head h3 { margin: 0; font-family: var(--label); font-weight: 700; font-size: 22px; line-height: 1.05; }
  .sheet-head p { margin: 2px 0 0; color: var(--paper-dim); font-size: 14px; }
  .move { display: grid; gap: 3px; padding: 10px 12px; border-radius: 7px; border: 1.5px solid var(--line); background: var(--ink); text-align: left; cursor: pointer; width: 100%; }
  .move .mh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .move .mn { font-family: var(--label); font-weight: 700; font-size: 18px; letter-spacing: .02em; color: var(--paper); }
  .move .md { font-size: 13.5px; color: var(--paper-dim); line-height: 1.35; }
  .move.special { border-color: var(--temple-dim); }

  .move:disabled { opacity: .45; cursor: default; }
  .move .why { font-family: var(--label); font-weight: 600; font-size: 13px; color: var(--gold); white-space: nowrap; }
  .hint { font-size: 13.5px; color: var(--paper-dim); text-align: center; }

  .overlay { position: fixed; inset: 0; z-index: 30; background: #140f0cf2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; text-align: center; }

  .formula input { width: min(320px, 100%); min-height: 50px; border-radius: 6px; border: 1.5px solid var(--temple); background: var(--ink-2); color: var(--paper); padding: 8px 12px; font: 18px var(--body); text-align: center; }
  .timer { font-family: var(--display); font-size: 44px; color: var(--gold); }

  /* ---------- collezione / regole ---------- */
  .collection { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding-bottom: 24px; }

  /* ---------- menu, progressi, torneo, online ---------- */
  .menu-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .menu .btn small, .btn small { display: block; font-family: var(--body); font-weight: 500; font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--paper-dim); }
  .menu-2 .btn { flex-direction: column; gap: 0; min-height: 56px; font-size: 17px; }
  .pick.locked .face { filter: grayscale(1) brightness(.45); }
  .lock { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); font-size: 26px; }
  .syn-box { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--ink-2); }
  .syn-box summary { font-family: var(--label); font-weight: 700; font-size: 15px; letter-spacing: .04em; cursor: pointer; }
  .syn { display: grid; gap: 6px; margin-top: 8px; }
  .syn-row { display: grid; gap: 1px; font-size: 13px; color: var(--muted); }
  .syn-row b { font-family: var(--label); font-size: 14px; color: var(--paper-dim); }
  .syn-row.on b { color: var(--jade); } .syn-row.on { color: var(--paper-dim); }
  .syn-tag { color: var(--jade); }
  .vs-card { border: 1.5px solid var(--temple-dim); border-radius: 7px; padding: 8px 10px; display: grid; gap: 4px; background: #2a150c; }
  .vs-card b { font-family: var(--label); font-size: 19px; }
  .faces-row { display: flex; gap: 5px; }
  .faces-row i { width: 38px; height: 38px; border-radius: 5px; background-size: cover; background-position: center; border: 1px solid var(--line); }
  .ladder { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .ladder li { border: 1.5px solid var(--line); border-radius: 7px; padding: 8px 10px; display: grid; gap: 6px; background: var(--ink-2); }
  .ladder li.done { opacity: .6; }
  .ladder li.done .lad-head span::after { content: ' ✓'; color: var(--jade); }
  .ladder li.now { border-color: var(--temple); }
  .lad-head { display: flex; align-items: baseline; gap: 8px; }
  .lad-head span { font-family: var(--display); font-size: 22px; color: var(--temple); }
  .lad-head b { font-family: var(--label); font-size: 17px; flex: 1; }
  .lad-head em { font-style: normal; font-family: var(--label); font-size: 13px; color: var(--gold); text-transform: uppercase; letter-spacing: .06em; }
  .lad-body { display: flex; align-items: center; gap: 10px; }
  .lad-body small { color: var(--paper-dim); font-size: 13px; }
  .rank-page { display: grid; gap: 10px; padding-bottom: 24px; }
  .sec { font-family: var(--label); font-weight: 700; font-size: 18px; letter-spacing: .05em; text-transform: uppercase; color: var(--temple); margin: 10px 0 0; }
  .board { width: 100%; border-collapse: collapse; font-size: 15px; }
  .board th { font-family: var(--label); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--paper-dim); text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .board td { padding: 7px 6px; border-bottom: 1px solid #2b221b; }
  .board tr.cpu td { color: var(--paper-dim); }
  .board td:nth-child(n+3), .board th:nth-child(n+3) { text-align: right; }
  .card-rank { display: grid; gap: 4px; }
  .cr-row { display: grid; grid-template-columns: 32px 1fr auto auto; gap: 10px; align-items: center; padding: 3px 0; border-bottom: 1px solid #2b221b; }
  .cr-row i { width: 32px; height: 32px; border-radius: 4px; background-size: cover; background-position: center; }
  .cr-row b { font-family: var(--label); font-size: 16px; color: var(--gold); }
  .cr-row small { color: var(--muted); font-size: 12px; min-width: 40px; text-align: right; }
  .code-box { border: 2px solid var(--temple); border-radius: 10px; padding: 16px; text-align: center; display: grid; gap: 6px; background: #2a150c; }
  .code { font-family: var(--display); font-size: 54px; letter-spacing: .12em; color: var(--temple); line-height: 1; }
  .code-box p { margin: 0; color: var(--paper-dim); font-size: 14px; }
  .or { text-align: center; color: var(--muted); font-family: var(--label); text-transform: uppercase; letter-spacing: .12em; font-size: 13px; }
  .err { color: #ff9c8c; margin: 0; font-size: 14px; }
  #oncode { text-transform: uppercase; letter-spacing: .2em; font-family: var(--label); font-size: 22px; text-align: center; }
  .tut { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--gold); border-radius: 8px; padding: 8px 10px; background: #2a1f10; }
  .tut > i { width: 42px; height: 42px; border-radius: 21px; background-size: cover; background-position: center; flex: none; border: 2px solid var(--gold); }
  .tut b { font-family: var(--label); font-size: 14px; color: var(--gold); letter-spacing: .04em; }
  .tut p { margin: 2px 0 0; font-size: 14px; line-height: 1.35; }
  .tut .btn { margin-top: 6px; min-height: 34px; font-size: 14px; }
  .pv { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); background: #140f0cdd; color: #ff8a73; font-family: var(--label); font-weight: 700; font-size: 14px; padding: 2px 7px; border-radius: 4px; white-space: nowrap; border: 1px solid #ff8a7355; }
  .pv.ko { color: #140f0c; background: var(--gold); border-color: var(--gold); }
  .toast { position: fixed; left: 16px; right: 16px; top: calc(20px + env(safe-area-inset-top, 0px)); z-index: 50; max-width: 480px; margin: 0 auto; background: #2a150c; border: 2px solid var(--temple); border-radius: 10px; padding: 12px 14px; box-shadow: 0 12px 30px #000c; animation: drop .35s ease-out; }
  .toast b { font-family: var(--display); font-size: 26px; color: var(--temple); font-weight: 400; display: block; line-height: 1.1; }
  .toast p { margin: 4px 0 0; font-size: 14px; color: var(--paper); }
  .toast.small { font-family: var(--label); font-weight: 600; font-size: 16px; text-align: center; }
  .toast.out { opacity: 0; transform: translateY(-20px); transition: opacity .3s, transform .3s; }
  @keyframes drop { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: none; } }
  .unlock { display: grid; gap: 6px; justify-items: center; border: 1.5px dashed var(--gold); border-radius: 8px; padding: 10px 14px; }
  .unlock p { color: var(--gold); }

  /* ---------- palestre (carte terreno) e armi ---------- */
  body { background-image: linear-gradient(#140f0ce6, #140f0cf2), var(--terrain, none); background-size: cover; background-position: center; background-attachment: fixed; }
  .terrains { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .terrain { display: grid; gap: 2px; padding: 0 0 6px; border: 1.5px solid var(--line); border-radius: 7px; background: var(--ink-2); overflow: hidden; cursor: pointer; text-align: left; }
  .terrain[aria-pressed="true"] { border-color: var(--temple); box-shadow: 0 0 0 2px var(--temple); }
  .terrain .art { aspect-ratio: 4/3; background: var(--ink-3) center / cover; display: grid; place-items: center; font-size: 30px; margin-bottom: 3px; }
  .terrain .tn { font-family: var(--label); font-weight: 700; font-size: 13.5px; line-height: 1.1; padding-inline: 6px; }
  .terrain .tp { font-size: 11.5px; color: var(--paper-dim); line-height: 1.2; padding-inline: 6px; }
  .terrain-card { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: center; text-align: left; border: 1.5px solid var(--gold); border-radius: 8px; padding: 8px; background: #1f1810; max-width: 420px; }
  .terrain-card .art { aspect-ratio: 4/3; border-radius: 5px; background: var(--ink-3) center / cover; }
  .terrain-card b { font-family: var(--label); font-size: 19px; color: var(--paper); display: block; line-height: 1.1; }
  .terrain-card p { margin: 3px 0 0; font-size: 13.5px; color: var(--paper-dim); }
  .terrain-chip { justify-self: center; min-height: 32px; padding: 4px 12px; border-radius: 16px; border: 1px solid var(--gold); background: #1f1810cc; color: var(--gold); font-family: var(--label); font-weight: 600; font-size: 13.5px; letter-spacing: .03em; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .weapon-box { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--ink-2); display: grid; gap: 6px; }
  .weapon-box .hint { margin: 0; }
  .wrow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .wrow select { min-height: 44px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--ink); color: var(--paper); padding: 6px 8px; font: 15px var(--body); min-width: 0; }
  .wpn { position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 12px; background: #000b; display: grid; place-items: center; font-size: 13px; }
  .wline { margin: 0; font-size: 14px; color: var(--paper-dim); }
  .wline b { color: var(--gold); font-family: var(--label); font-size: 16px; }
  .coll-list { display: grid; gap: 8px; padding-bottom: 12px; }
  .weapon-row { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--ink-2); }
  .weapon-row b { font-family: var(--label); font-size: 17px; }
  .weapon-row small { margin-left: 8px; color: var(--gold); font-family: var(--label); font-size: 13px; }
  .weapon-row p { margin: 2px 0 0; font-size: 13.5px; color: var(--paper-dim); }
  .overlay .terrain-card p { max-width: none; }

  /* ---------- account e classifica generale ---------- */
  .acc-card { display: grid; gap: 4px; border: 1.5px solid var(--gold); border-radius: 8px; padding: 12px 14px; background: #1f1810; }
  .acc-name { font-family: var(--display); font-weight: 400; font-size: 32px; color: var(--temple); line-height: 1.05; }
  .acc-lvl { font-family: var(--label); font-weight: 700; font-size: 18px; color: var(--gold); }
  .acc-card small { color: var(--paper-dim); font-size: 13px; }
  .xpbar { height: 10px; border-radius: 5px; background: #000; overflow: hidden; }
  .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--temple), var(--gold)); }
  .acc-edit { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin: 10px 0 8px; }
  .acc-edit input { min-height: 42px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--ink); color: var(--paper); padding: 6px 10px; font: 16px var(--body); min-width: 0; }
  .board tr.me td { color: var(--temple); font-weight: 700; }
  .showpw { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--paper-dim); margin-top: -6px; }
  .showpw input { width: 20px; height: 20px; accent-color: var(--temple); }
  .ok-msg { color: var(--jade); margin: 0; font-size: 14px; }
  .menu .acc-btn { flex-direction: column; gap: 0; }
  .xp-line { color: var(--gold) !important; font-family: var(--label); font-weight: 700; font-size: 17px; }

  /* ---------- arena 3D ---------- */
  .arena3d { position: fixed; inset: 0; z-index: 40; background: #1b120d; overflow: hidden; cursor: pointer; }
  .arena3d canvas { position: absolute; inset: 0; display: block; }
  .arena-title { position: absolute; left: 16px; right: 16px; top: calc(18px + env(safe-area-inset-top, 0px)); text-align: center; pointer-events: none; z-index: 2; }
  .arena-who { font-family: var(--label); font-weight: 700; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--paper); text-shadow: 0 2px 4px #000; }
  .arena-move { font-family: var(--display); font-size: clamp(28px, 8.5vw, 46px); line-height: 1.05; color: var(--temple); text-shadow: 0 3px 0 #140f0c, 0 0 18px #000a; text-wrap: balance; }
  .arena3d.show .arena-title { animation: slam .45s cubic-bezier(.2, 1.6, .4, 1); }
  .arena-flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; z-index: 1; }
  .arena-skip { position: absolute; left: 16px; right: 140px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); text-align: left; font-family: var(--label); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--paper-dim); z-index: 2; pointer-events: none; }
  .arena-speed { position: absolute; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 3; }
  .arena-speed .speed { background: #140f0ccc; }
  @keyframes slam { from { transform: scale(1.8); opacity: 0; } to { transform: none; opacity: 1; } }
  body.arena-open { overflow: hidden; }

  @media (min-width: 480px) { .pool { grid-template-columns: repeat(4, 1fr); } .collection { grid-template-columns: repeat(3, 1fr); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
